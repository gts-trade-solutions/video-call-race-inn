  </g>
  <g filter="url(#soft)" fill="#bfe8f6" opacity="0.6">
    <ellipse cx="200" cy="460" rx="220" ry="10"/>
    <ellipse cx="760" cy="520" rx="300" ry="12"/>
    <ellipse cx="420" cy="600" rx="260" ry="12"/>
    <ellipse cx="1050" cy="640" rx="240" ry="12"/>
  </g>
  <g filter="url(#soft)">
