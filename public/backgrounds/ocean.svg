<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="osky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec9ee"/><stop offset="1" stop-color="#d9f0fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7fae"/><stop offset="1" stop-color="#59b6d8"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1280" height="400" fill="url(#osky)"/>
  <rect y="380" width="1280" height="340" fill="url(#sea)"/>
